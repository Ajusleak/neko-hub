services:
  neikos-web:
    build:
      context: ../..
      dockerfile: infra/container/Dockerfile
    environment:
      NEIKOS_ENV: staging
      NEIKOS_DEPLOYMENT_ID: compose-local-staging
      NEIKOS_RELEASE_VERSION: 3.0.0-local-staging
      NEIKOS_PUBLIC_ORIGIN: http://localhost:3000
      NEIKOS_IDENTITY_ADAPTER: local-staging-header-identity-v1
      NEIKOS_PERSISTENCE_ADAPTER: local-staging-memory-persistence-v1
      NEIKOS_EVENTS_ADAPTER: local-staging-memory-events-v1
      NEIKOS_NOTIFICATIONS_ADAPTER: local-staging-memory-notifications-v1
      NEIKOS_FORTNITE_ADAPTER: local-staging-fortnite-fixture-v1
      NEIKOS_AI_ADAPTER: local-staging-echo-ai-v1
      NEIKOS_OBSERVABILITY_ADAPTER: local-staging-process-observability-v1
      NEIKOS_READINESS_TIMEOUT_MS: "1000"
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
